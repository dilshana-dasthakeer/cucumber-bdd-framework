name: Unpack project zip
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          if [ ! -f cucumber-bdd-framework.zip ]; then echo "no zip"; exit 0; fi
          unzip -oq cucumber-bdd-framework.zip
          rm cucumber-bdd-framework.zip
          git config user.name "Dilshana Dasthakeer"
          git config user.email "dilshana-dasthakeer@users.noreply.github.com"
          git add -A
          git commit -m "Add Cucumber BDD framework"
          git push
